<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamesTab Quick Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --bg: #0c1016;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            width: 250px;
            margin: 0;
            padding: 1rem;
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.8rem;
        }

        .header i {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .header h3 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass);
            padding: 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .toggle-label {
            font-size: 0.9rem;
            font-weight: 700;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.8rem;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent);
        }

        .footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <i class="fa-solid fa-gamepad"></i>
        <h3>GamesTab Config</h3>
    </div>

    <div class="control-group">
        <div class="toggle-item">
            <span class="toggle-label">CUSTOM NEW TAB</span>
            <label class="switch">
                <input type="checkbox" id="enable-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <button class="btn" id="open-settings">
            <i class="fa-solid fa-gear"></i> OPEN SETTINGS
        </button>
    </div>

    <div class="footer">
        ANIK v1.0.0
    </div>

    <script type="module" src="/src/popup.ts"></script>
</body>
</html>
